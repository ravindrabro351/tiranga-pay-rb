<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tiranga Pay</title><link rel="manifest" href="manifest.json"><style>
:root{--s:#ff7a00;--g:#07883b;--r:#d92d20;--m:#667085;--l:#e4e7ec;--bg:#f6f8fb}*{box-sizing:border-box}html,body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#101828}button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{width:min(560px,100%);margin:auto;min-height:100dvh;background:#fff}.top{text-align:center;padding:13px}.brand{font-size:25px;font-weight:950}.s{color:var(--s)}.g{color:var(--g)}.tag,.label{font-size:10px;color:var(--m)}.tri{height:7px;background:linear-gradient(90deg,var(--s) 0 33%,#fff 33% 66%,var(--g) 66%)}.card{background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 4px 18px #1018280a}.btn{border:0;border-radius:10px;padding:11px 14px;color:#fff;background:var(--g);font-weight:850}.btn.orange{background:var(--s)}.btn.red{background:var(--r)}.btn.out{background:#fff;color:var(--g);border:1px solid var(--g)}.btn:disabled{opacity:.55}.form{display:grid;gap:9px}input,select,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px}.auth{padding:22px}.authbox{padding:18px}.page{display:none;padding:10px 12px 82px}.page.active{display:block}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.profile{padding:12px}.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#ff8a00 0 33%,#fff 33% 66%,#07883b 66%);border:2px solid #efbb67}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.metric{padding:10px;text-align:center}.activation{padding:12px;margin-top:8px;background:linear-gradient(135deg,#fffaf2,#fff);border-color:#f3c66f}.setup,.quick{padding:10px;margin-top:8px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center;margin-top:8px}.num{width:28px;height:28px;border-radius:50%;background:#e7f7ed;color:var(--g);display:grid;place-items:center;margin:auto;font-weight:900}.step b{font-size:8px;display:block}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800;background:#e8f7ee;color:#06752f}.badge.gray{background:#f2f4f7;color:#475467}.badge.orange{background:#fff4df;color:#985b00}.badge.red{background:#feeceb;color:#b42318}.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}.q{border:1px solid var(--l);border-radius:10px;padding:7px 3px;text-align:center;min-height:70px;background:#fff}.q .i{font-size:18px}.q b{display:block;font-size:8px}.q small{font-size:8px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--l);padding:7px 4px;z-index:30}.nav{border:0;background:#fff;font-size:8px;color:#475467}.nav span{display:block;font-size:18px}.nav.active{color:var(--s);font-weight:900}.list,.menu{display:grid;gap:8px}.item{padding:11px}.menu button{width:100%;text-align:left;padding:13px;border:1px solid var(--l);border-radius:10px;background:#fff}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:14px;z-index:60}.modal .card{width:min(480px,100%);max-height:92vh;overflow:auto;padding:16px}.notice{padding:10px;border-radius:10px;background:#fff7e8;border:1px solid #f0cf8d;color:#8b5c00;font-size:12px}.account-card{padding:10px;margin:8px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tabs button{border:1px solid var(--l);background:#fff;border-radius:9px;padding:10px}.tabs button.active{background:#eaf7ee;color:var(--g);font-weight:850}.policy{white-space:pre-wrap;line-height:1.5}
</style></head><body>
<div id="authView" class="app"><div class="top">🇮🇳<div class="brand"><span class="s">TIRANGA</span> <span class="g">PAY</span></div><div class="tag">Bharat ka Vishwas, Tirange ke Saath</div></div><div class="tri"></div><div class="auth"><div id="loginBox" class="card authbox"><h2>Welcome Back</h2><div class="form"><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button class="btn" onclick="loginUser()">Login</button><button class="btn out" onclick="showRegister()">Register</button><button class="btn orange" onclick="openSupport()">Customer Support</button><button class="btn out" onclick="forgotPassword()">Forgot Password</button><div id="lm" class="label"></div></div></div><div id="registerBox" class="card authbox hidden"><h2>Create Account</h2><div class="form"><input id="rn" placeholder="Username"><input id="rphone" placeholder="Mobile Number"><input id="re" type="email" placeholder="Email"><input id="rp" type="password" placeholder="Password"><input id="rp2" type="password" placeholder="Confirm Password"><input id="captchaShow" readonly><input id="captchaEnter" placeholder="Enter shown code"><button class="btn" onclick="registerUser()">Register</button><button class="btn out" onclick="showLogin()">Back</button><div id="rm" class="label"></div></div></div></div></div>
<div id="mainView" class="app hidden"><div class="top">🇮🇳<div class="brand"><span class="s">TIRANGA</span> <span class="g">PAY</span></div><div class="tag">Bharat ka Vishwas, Tirange ke Saath</div></div><div class="tri"></div><section id="home" class="page active"><div class="card profile row"><div class="avatar">👤</div><div style="flex:1"><div class="label">Welcome Back,</div><b id="uName"></b><div class="label">User ID: <span id="uId"></span></div></div><div><span id="bonusTop" class="badge">₹0</span><button style="border:0;background:none" onclick="logoutUser()">⎋ Logout</button></div></div><div class="metrics"><div class="card metric"><div class="label">Total Balance</div><b id="balance"></b></div><div class="card metric"><div class="label">Commission</div><b id="commission"></b></div><div class="card metric"><div class="label">Transactions</div><b id="txCount"></b></div></div><div class="card activation row"><div style="font-size:31px">🛡️</div><div style="flex:1"><b id="activationTitle"></b><div id="activationText" class="label"></div><div id="activationPermanent" class="label"></div></div><button id="activationButton" class="btn orange" onclick="openActivation()">Activate</button></div><div class="card setup"><b>ACCOUNT SETUP</b><div id="steps" class="steps"></div></div><div class="card quick"><b>QUICK ACCESS</b><div id="quickGrid" class="quick-grid"></div></div></section><section id="activity" class="page"><h2>Activity</h2><div id="activityList" class="list"></div></section><section id="transactions" class="page"><h2>Transactions</h2><div id="txList" class="list"></div></section><section id="runstatus" class="page"><h2>Account Run Status</h2><div class="card metric"><div style="font-size:58px">🛡️</div><h2 id="runStatus"></h2><p id="runCopy" class="label"></p></div><div id="runHistory" class="list"></div></section><section id="profile" class="page"><h2>Profile</h2><div class="card profile"><h2 id="pName"></h2><p id="pEmail"></p><p id="pPhone"></p><p>Status: <b id="pStatus"></b></p></div><div id="profileMenu" class="menu"></div></section><nav class="bottom"><button class="nav active" onclick="goPage('home',this)"><span>⌂</span>Home</button><button class="nav" onclick="goPage('activity',this)"><span>▤</span>Activity</button><button class="nav" onclick="goPage('transactions',this)"><span>⇄</span>Transaction</button><button class="nav" onclick="goPage('runstatus',this)"><span>🛡</span>Run Status</button><button class="nav" onclick="goPage('profile',this)"><span>◉</span>Profile</button></nav></div><div id="modal" class="modal hidden"><div class="card"><button style="float:right;border:0;background:none;font-size:22px" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script type="module" src="app.js"></script></body></html>
