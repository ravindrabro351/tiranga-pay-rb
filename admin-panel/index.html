<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Tiranga Pay Admin</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,button{padding:10px;border-radius:9px;border:1px solid #ccd3df}button{background:#0b2a55;color:#fff;border:0;font-weight:700}.green{background:#079447}.red{background:#c62828}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.nav button{margin-right:8px;margin-bottom:8px}.muted{color:#6b7280;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class='wrap'>
<div id='loginBox' class='card' style='max-width:420px;margin:12vh auto'><h2>Admin Login</h2><input id='email' placeholder='Admin email' style='width:100%;box-sizing:border-box;margin-bottom:8px'><input id='pass' type='password' placeholder='Password' style='width:100%;box-sizing:border-box;margin-bottom:8px'><button style='width:100%' onclick='adminLogin()'>Login</button><p id='msg' class='muted'></p></div>
<div id='panel' class='hidden'><h1>Tiranga Pay Admin</h1><div class='nav'><button onclick="showP('dashboard')">Dashboard</button><button onclick="showP('users')">Users</button><button onclick="showP('payments')">Activation</button><button onclick="showP('withdrawals')">Withdrawals</button><button onclick="showP('settings')">Settings</button><button onclick="showP('audit')">Audit</button><button class='red' onclick='logoutAdmin()'>Logout</button></div>
<section id='dashboardP'><div class='grid'><div class='card'>Total Users<h2 id='totalUsers'>0</h2></div><div class='card'>Active Users<h2 id='activeUsers'>0</h2></div><div class='card'>Pending Activation<h2 id='pendingA'>0</h2></div><div class='card'>Pending Withdrawals<h2 id='pendingW'>0</h2></div></div></section>
<section id='usersP' class='hidden'><div class='card' style='overflow:auto'><table><thead><tr><th>User</th><th>Email</th><th>Status</th><th>Balance</th><th>Commission</th><th>Rate</th><th>Action</th></tr></thead><tbody id='usersBody'></tbody></table></div></section>
<section id='paymentsP' class='hidden'><div id='paymentsList'></div></section><section id='withdrawalsP' class='hidden'><div id='withdrawalsList'></div></section>
<section id='settingsP' class='hidden'><div class='card'><h3>Settings</h3><input id='bonusAmount' type='number' placeholder='Bonus'><input id='activationFee' type='number' placeholder='Activation Fee'><input id='commissionRate' type='number' step='.1' placeholder='Commission %'><input id='adminUpiId' placeholder='Admin UPI ID'><input id='paymentQr' placeholder='Payment QR image URL'><input id='supportContact' placeholder='Support Contact'>
<input id='gamingFundRate' type='number' step='.1' placeholder='Gaming Fund %'>
<input id='stockFundRate' type='number' step='.1' placeholder='Stock Fund %'>
<input id='mixFundRate' type='number' step='.1' placeholder='Mix Fund %'>
<input id='politicalFundRate' type='number' step='.1' placeholder='Political Fund %'>
<input id='outsideFundRate' type='number' step='.1' placeholder='Outside Fund %'><button class='green' onclick='saveSettings()'>Save Settings</button></div></section>
<section id='auditP' class='hidden'><div id='auditList' class='card'></div></section></div></div>
<script type='module'>
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{getDatabase,ref,get,set,update,push,onValue}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyBXE71K1QSaW9T2gWnDNFpA5ARUhqhOnPc',authDomain:'tiranga-pay.firebaseapp.com',databaseURL:'https://tiranga-pay-default-rtdb.firebaseio.com',projectId:'tiranga-pay',storageBucket:'tiranga-pay.firebasestorage.app',messagingSenderId:'1060443095422',appId:'1:1060443095422:web:6c532added4d689969332f',measurementId:'G-JCWZDJS9FH'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);let admin=null;const $=x=>document.getElementById(x),money=n=>'₹'+Number(n||0).toLocaleString('en-IN');window.adminLogin=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('pass').value)}catch(e){$('msg').textContent=e.message}};window.logoutAdmin=()=>signOut(auth);window.showP=n=>['dashboard','users','payments','withdrawals','settings','audit'].forEach(x=>$(x+'P').classList.toggle('hidden',x!==n));async function isAdmin(u){const s=await get(ref(db,'admins/'+u.uid));return s.exists()&&s.val().role==='superadmin'}async function audit(action,details){const k=push(ref(db,'auditLogs')).key;await set(ref(db,'auditLogs/'+k),{adminUid:admin.uid,adminEmail:admin.email,action,details:details||{},createdAt:Date.now()})}
function bind(){onValue(ref(db,'users'),s=>{const arr=Object.entries(s.val()||{});$('totalUsers').textContent=arr.length;$('activeUsers').textContent=arr.filter(([,u])=>u.accountStatus==='running').length;$('usersBody').innerHTML=arr.map(([uid,u])=>`<tr><td>${u.username||uid.slice(0,8)}</td><td>${u.email||''}</td><td>${u.accountStatus||'stopped'}</td><td>${money(u.balance)}</td><td>${money(u.commission)}</td><td>${u.commissionRate||0}%</td><td><button class='green' onclick="setStatus('${uid}','running')">Run</button> <button class='red' onclick="setStatus('${uid}','stopped')">Stop</button> <button onclick="adjust('${uid}')">Adjust</button></td></tr>`).join('')});onValue(ref(db,'activationPayments'),s=>{const a=Object.entries(s.val()||{});$('pendingA').textContent=a.filter(([,x])=>x.status==='pending').length;$('paymentsList').innerHTML=a.map(([uid,p])=>`<div class='card'><b>${p.email||''}</b><p>${money(p.amount)} · UTR ${p.utr||''} · ${p.status}</p><button class='green' onclick="activation('${uid}','approved')">Approve</button> <button class='red' onclick="activation('${uid}','rejected')">Reject</button></div>`).join('')||'<div class=card>No requests</div>'});onValue(ref(db,'withdrawals'),s=>{const a=Object.entries(s.val()||{});$('pendingW').textContent=a.filter(([,x])=>x.status==='pending').length;$('withdrawalsList').innerHTML=a.map(([id,w])=>`<div class='card'><b>${w.email||''}</b><p>${money(w.amount)} · ${w.status}</p><button class='green' onclick="withdraw('${id}','approved')">Approve</button> <button class='red' onclick="withdraw('${id}','rejected')">Reject</button> <button onclick="withdraw('${id}','paid')">Mark Paid</button></div>`).join('')||'<div class=card>No requests</div>'});onValue(ref(db,'settings'),s=>{const x=s.val()||{};['bonusAmount','activationFee','commissionRate','adminUpiId','paymentQr','supportContact','gamingFundRate','stockFundRate','mixFundRate','politicalFundRate','outsideFundRate'].forEach(k=>$(k).value=x[k]??'')});onValue(ref(db,'auditLogs'),s=>{const a=Object.values(s.val()||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('auditList').innerHTML=a.map(x=>`<p><b>${x.action}</b><br><span class='muted'>${new Date(x.createdAt).toLocaleString('en-IN')} · ${x.adminEmail}</span></p>`).join('')||'No audit logs'})}
window.setStatus=async(uid,status)=>{await update(ref(db,'users/'+uid),{accountStatus:status,setupStep:status==='running'?4:3});await audit('USER_STATUS_CHANGED',{uid,status})};window.adjust=async uid=>{const s=await get(ref(db,'users/'+uid)),u=s.val()||{};const b=prompt('New balance',u.balance||0);if(b===null)return;const c=prompt('New commission',u.commission||0);if(c===null)return;const r=prompt('Commission %',u.commissionRate||0);if(r===null)return;const reason=prompt('Reason required','');if(!reason)return alert('Reason required');await update(ref(db,'users/'+uid),{balance:Number(b),commission:Number(c),commissionRate:Number(r)});await audit('FINANCIAL_ADJUSTMENT',{uid,balance:Number(b),commission:Number(c),commissionRate:Number(r),reason})};window.activation=async(uid,status)=>{await update(ref(db,'activationPayments/'+uid),{status,reviewedAt:Date.now(),reviewedBy:admin.uid});if(status==='approved')await update(ref(db,'users/'+uid),{accountStatus:'running',setupStep:4});await audit('ACTIVATION_'+status.toUpperCase(),{uid})};window.withdraw=async(id,status)=>{const s=await get(ref(db,'withdrawals/'+id));if(!s.exists())return;const w=s.val();if(status==='paid'&&w.status==='paid')return alert('Already paid');await update(ref(db,'withdrawals/'+id),{status,reviewedAt:Date.now(),reviewedBy:admin.uid});if(status==='paid'){const us=await get(ref(db,'users/'+w.uid)),u=us.val()||{};let left=Number(w.amount),balance=Number(u.balance||0),commission=Number(u.commission||0),bonus=Number(u.bonus||0);if(left>balance+commission+bonus){await update(ref(db,'withdrawals/'+id),{status:'pending'});return alert('Insufficient total')}let x=Math.min(left,balance);balance-=x;left-=x;x=Math.min(left,commission);commission-=x;left-=x;x=Math.min(left,bonus);bonus-=x;await update(ref(db,'users/'+w.uid),{balance,commission,bonus,totalTransactions:Number(u.totalTransactions||0)+1});const k=push(ref(db,'transactions/'+w.uid)).key;await set(ref(db,'transactions/'+w.uid+'/'+k),{type:'Withdrawal',amount:-Number(w.amount),status:'paid',createdAt:Date.now(),withdrawalId:id})}await audit('WITHDRAWAL_'+status.toUpperCase(),{id,uid:w.uid,amount:w.amount})};window.saveSettings=async()=>{const d={
bonusAmount:Number($('bonusAmount').value||0),
activationFee:Number($('activationFee').value||0),
commissionRate:Number($('commissionRate').value||0),
adminUpiId:$('adminUpiId').value,
paymentQr:$('paymentQr').value,
supportContact:$('supportContact').value,
gamingFundRate:Number($('gamingFundRate').value||15),
stockFundRate:Number($('stockFundRate').value||30),
mixFundRate:Number($('mixFundRate').value||25),
politicalFundRate:Number($('politicalFundRate').value||20),
outsideFundRate:Number($('outsideFundRate').value||10),
updatedAt:Date.now(),
updatedBy:admin.uid
};await update(ref(db,'settings'),d);await audit('SETTINGS_UPDATED',d);alert('Settings saved and synced')};onAuthStateChanged(auth,async u=>{if(!u){admin=null;$('loginBox').classList.remove('hidden');$('panel').classList.add('hidden');return}if(!(await isAdmin(u))){$('msg').textContent='Not authorized as superadmin';await signOut(auth);return}admin=u;$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');bind()});
</script></body></html>
